  immutable@^4: ^4.3.9
  fast-uri: ^3.1.9
  js-yaml@^3: ^3.15.2
  js-yaml@^4: ^4.3.2
  brace-expansion@^1: ^1.1.21
  browserslist: ^4.28.7
  nanoid@^3: ^3.3.18
  postcss: ^8.5.23
  qs: ^6.16.0
  uuid@^8: ^11.1.1
  http-proxy-middleware@^2: ^2.0.10
  baseline-browser-mapping: ^2.11.0
  postcss-selector-parser@^7: ^7.1.3
  body-parser@^1: ^1.20.9
  source-map-js@^1: ^1.2.2
  proxy-addr@^2: ^2.0.8
  compression@^1: ^1.8.2
  follow-redirects@^1: ^1.16.1
  launch-editor@^2: ^2.14.2
