  brace-expansion@^1: ^1.1.18
  browserslist: ^4.28.7
  nanoid@^3: ^3.3.18
  postcss: ^8.5.23
  qs: ^6.16.0
  uuid@^8: ^11.1.1
  http-proxy-middleware@^2: ^2.0.10
  baseline-browser-mapping: ^2.11.0
